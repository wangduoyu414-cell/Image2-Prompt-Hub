services:
  postgres:
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${INVENTORY_POSTGRES_PORT}:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${INVENTORY_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${INVENTORY_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${INVENTORY_S3_PORT}:9000"
    volumes:
      - inventory-minio-data:/data

volumes:
  inventory-postgres-data:
  inventory-minio-data:
