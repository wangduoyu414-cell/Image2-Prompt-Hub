name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Install locked Python environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.28
          uv sync --frozen
      - name: Run Python tests
        run: uv run python -m pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate public Web
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test
          npm run typecheck
          npm run build

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate production Compose
        run: docker compose --env-file deploy/production.env.example -f compose.prod.yaml config --quiet
      - name: Build production images
        run: docker compose --env-file deploy/production.env.example -f compose.prod.yaml build public-api web
