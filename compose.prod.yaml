name: image2-prompt-hub

x-python-image: &python-image
  image: image2-python:${IMAGE2_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: deploy/Dockerfile.python

x-python-runtime: &python-runtime
  <<: *python-image
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - backend
    - egress

services:
  postgres:
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IMAGE2_POSTGRES_DB:?set IMAGE2_POSTGRES_DB}
      POSTGRES_USER: ${IMAGE2_POSTGRES_USER:?set IMAGE2_POSTGRES_USER}
      POSTGRES_PASSWORD: ${IMAGE2_POSTGRES_PASSWORD:?set IMAGE2_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:8.8.0-alpine3.23@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    <<: *python-image
    init: true
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      INVENTORY_DATABASE_URL: ${IMAGE2_DATABASE_URL:?set IMAGE2_DATABASE_URL}
    command: ["python", "-m", "inventory", "migrate", "--migrations-dir", "/app/migrations", "--json"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  bootstrap-fixed-history:
    <<: *python-runtime
    profiles: ["bootstrap"]
    restart: "no"
    environment:
      INVENTORY_DATABASE_URL: ${IMAGE2_DATABASE_URL:?set IMAGE2_DATABASE_URL}
      INVENTORY_S3_ENDPOINT_URL: ${IMAGE2_S3_ENDPOINT_URL:?set IMAGE2_S3_ENDPOINT_URL}
      INVENTORY_S3_BUCKET: ${IMAGE2_S3_BUCKET:?set IMAGE2_S3_BUCKET}
      INVENTORY_S3_ACCESS_KEY: ${IMAGE2_S3_ACCESS_KEY_ID:?set IMAGE2_S3_ACCESS_KEY_ID}
      INVENTORY_S3_SECRET_KEY: ${IMAGE2_S3_SECRET_ACCESS_KEY:?set IMAGE2_S3_SECRET_ACCESS_KEY}
      INVENTORY_S3_REGION: ${IMAGE2_S3_REGION:-auto}
    command:
      - python
      - -m
      - inventory
      - import-fixed-history
      - --registry
      - /app/config/sources-v2.yaml
      - --audit
      - /app/reports/source-audit-v2.json
      - --source-id
      - chaosrealmsai-gpt-image-2-gallery
      - --git-data-root
      - /var/lib/image2/git
      - --package-root
      - /var/lib/image2/packages
      - --json
    volumes:
      - sync-runtime:/var/lib/image2
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - egress

  public-api:
    <<: *python-runtime
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      PUBLIC_API_DATABASE_URL: ${IMAGE2_DATABASE_URL:?set IMAGE2_DATABASE_URL}
      PUBLIC_API_S3_ENDPOINT_URL: ${IMAGE2_S3_ENDPOINT_URL:?set IMAGE2_S3_ENDPOINT_URL}
      PUBLIC_API_S3_ACCESS_KEY_ID: ${IMAGE2_S3_ACCESS_KEY_ID:?set IMAGE2_S3_ACCESS_KEY_ID}
      PUBLIC_API_S3_SECRET_ACCESS_KEY: ${IMAGE2_S3_SECRET_ACCESS_KEY:?set IMAGE2_S3_SECRET_ACCESS_KEY}
      PUBLIC_API_S3_REGION: ${IMAGE2_S3_REGION:-auto}
      IMAGE2_ENVIRONMENT: ${IMAGE2_ENVIRONMENT:-production}
      IMAGE2_RELEASE: ${IMAGE2_RELEASE:-local}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    networks:
      - backend
      - egress

  admin-api:
    <<: *python-runtime
    command: ["uvicorn", "apps.admin_api.main:app", "--host", "0.0.0.0", "--port", "8002", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      CONTENT_DATABASE_URL: ${IMAGE2_DATABASE_URL:?set IMAGE2_DATABASE_URL}
      INVENTORY_S3_ENDPOINT_URL: ${IMAGE2_S3_ENDPOINT_URL:?set IMAGE2_S3_ENDPOINT_URL}
      INVENTORY_S3_ACCESS_KEY: ${IMAGE2_S3_ACCESS_KEY_ID:?set IMAGE2_S3_ACCESS_KEY_ID}
      INVENTORY_S3_SECRET_KEY: ${IMAGE2_S3_SECRET_ACCESS_KEY:?set IMAGE2_S3_SECRET_ACCESS_KEY}
      INVENTORY_S3_REGION: ${IMAGE2_S3_REGION:-auto}
      IMAGE2_ADMIN_USERS_JSON: ${IMAGE2_ADMIN_USERS_JSON:?set IMAGE2_ADMIN_USERS_JSON}
      IMAGE2_ADMIN_SESSION_SECRET: ${IMAGE2_ADMIN_SESSION_SECRET:?set IMAGE2_ADMIN_SESSION_SECRET}
      IMAGE2_ADMIN_ALLOWED_ORIGINS: ${IMAGE2_PUBLIC_ORIGIN:?set IMAGE2_PUBLIC_ORIGIN}
      IMAGE2_ADMIN_SECURE_COOKIES: "true"
      IMAGE2_ADMIN_SOURCE_AUDIT: /app/reports/source-audit-v2.json
      IMAGE2_ENVIRONMENT: ${IMAGE2_ENVIRONMENT:-production}
      IMAGE2_RELEASE: ${IMAGE2_RELEASE:-local}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    networks:
      - backend
      - egress

  scheduler:
    <<: *python-runtime
    command: ["python", "-m", "sync", "run-scheduler", "--json"]
    environment: &sync-environment
      SYNC_DATABASE_URL: ${IMAGE2_DATABASE_URL:?set IMAGE2_DATABASE_URL}
      SYNC_REDIS_URL: redis://redis:6379/0
      SYNC_S3_ENDPOINT_URL: ${IMAGE2_S3_ENDPOINT_URL:?set IMAGE2_S3_ENDPOINT_URL}
      SYNC_S3_BUCKET: ${IMAGE2_S3_BUCKET:?set IMAGE2_S3_BUCKET}
      SYNC_S3_ACCESS_KEY_ID: ${IMAGE2_S3_ACCESS_KEY_ID:?set IMAGE2_S3_ACCESS_KEY_ID}
      SYNC_S3_SECRET_ACCESS_KEY: ${IMAGE2_S3_SECRET_ACCESS_KEY:?set IMAGE2_S3_SECRET_ACCESS_KEY}
      SYNC_S3_REGION: ${IMAGE2_S3_REGION:-auto}
      SYNC_GIT_DATA_ROOT: /var/lib/image2/git
      SYNC_PACKAGE_ROOT: /var/lib/image2/packages
      SYNC_EVIDENCE_ROOT: /var/lib/image2/evidence
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      SYNC_JITTER_SECONDS: ${SYNC_JITTER_SECONDS:-60}
      SYNC_MESSAGE_STALE_SECONDS: ${SYNC_MESSAGE_STALE_SECONDS:-18000}
      IMAGE2_ENVIRONMENT: ${IMAGE2_ENVIRONMENT:-production}
      IMAGE2_RELEASE: ${IMAGE2_RELEASE:-local}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
    read_only: true
    volumes:
      - sync-runtime:/var/lib/image2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis.from_url('redis://redis:6379/0').ping()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *python-runtime
    command: ["dramatiq", "sync.scheduler", "--processes", "1", "--threads", "2", "--queues", "source-sync"]
    environment: *sync-environment
    read_only: true
    volumes:
      - sync-runtime:/var/lib/image2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis.from_url('redis://redis:6379/0').ping()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  monitor:
    <<: *python-runtime
    command: ["python", "-m", "sync", "run-monitor", "--json"]
    environment:
      SYNC_DATABASE_URL: ${IMAGE2_DATABASE_URL:?set IMAGE2_DATABASE_URL}
      SYNC_REDIS_URL: redis://redis:6379/0
      IMAGE2_PUBLIC_ORIGIN: http://web:3000
      IMAGE2_ALERT_WEBHOOK_URL: ${IMAGE2_ALERT_WEBHOOK_URL:-}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-300}
      MONITOR_SYNC_STALE_SECONDS: ${MONITOR_SYNC_STALE_SECONDS:-28800}
      IMAGE2_ENVIRONMENT: ${IMAGE2_ENVIRONMENT:-production}
      IMAGE2_RELEASE: ${IMAGE2_RELEASE:-local}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_CONSOLE_EXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://web:3000/readyz', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 20s

  web:
    image: image2-web:${IMAGE2_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        IMAGE2_API_INTERNAL_BASE_URL: http://public-api:8000
        IMAGE2_ADMIN_API_BASE_URL: http://admin-api:8002
        IMAGE2_INTERNAL_PREVIEW_API_BASE_URL: http://127.0.0.1:8001
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/.next/cache:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      IMAGE2_API_INTERNAL_BASE_URL: http://public-api:8000
      IMAGE2_ADMIN_API_BASE_URL: http://admin-api:8002
      IMAGE2_INTERNAL_PREVIEW_API_BASE_URL: http://127.0.0.1:8001
    depends_on:
      public-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
    networks:
      - backend

  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    init: true
    restart: unless-stopped
    environment:
      IMAGE2_SITE_ADDRESS: ${IMAGE2_SITE_ADDRESS:?set IMAGE2_SITE_ADDRESS}
      IMAGE2_TLS_EMAIL: ${IMAGE2_TLS_EMAIL:-ops@example.invalid}
    ports:
      - ${IMAGE2_HTTP_PORT:-80}:80
      - ${IMAGE2_HTTPS_PORT:-443}:443
      - ${IMAGE2_HTTPS_PORT:-443}:443/udp
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
      - egress

networks:
  backend:
    internal: true
  egress:

volumes:
  postgres-data:
  redis-data:
  sync-runtime:
  caddy-data:
  caddy-config:
