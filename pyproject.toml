[project]
name = "image2-ingestion"
version = "0.1.0"
description = "Fixed-commit, local-only extraction slice for g0dam work prompts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.23",
  "dramatiq[redis]==2.2.0",
  "fastapi==0.115.12",
  "jsonschema==4.25.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "pydantic==2.11.7",
  "psycopg[binary]==3.2.10",
  "redis==8.0.1",
  "sentry-sdk==2.66.1",
  "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
